services:
  fr24-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fr24-server
    command: ["python", "fr24_server.py"]
    restart: unless-stopped
    ports:
      - "${FR24_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/duckdb:/app/duckdb
      - ./data/logs:/app/logs
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8080)); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
